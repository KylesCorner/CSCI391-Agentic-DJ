[project]
name = "encore-music-agent"
version = "0.1.0"
description = "A bounded music agent for ListenBrainz and MusicBrainz"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "python-dotenv>=1.0,<2",
  "jsonschema>=4.23,<5",
  "ytmusicapi>=1.12.3",
  "chromadb>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
encore = "encore.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/encore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
